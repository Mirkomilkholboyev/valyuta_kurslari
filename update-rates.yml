name: Daily FX archive

on:
  schedule:
    - cron: '15 3 * * *'    # 03:15 UTC = 08:15 Tashkent, morning run
    - cron: '30 11 * * *'   # 11:30 UTC = 16:30 Tashkent, afternoon run (settled rates)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and append today's rates
        run: python update_rates.py
      - name: Commit the updated archive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || git commit -m "rates: $(date -u +%F) [skip ci]"
          git push
